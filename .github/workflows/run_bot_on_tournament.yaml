name: Forecast on new AI tournament questions

on:
  workflow_dispatch:
  # Turned on 2026-11-20 after the "Test Bot" workflow passed with real keys.
  # To pause the bot, comment out the two lines below.
  schedule:
    - cron: "11,31,51 * * * *" # every 20 min, offset off the hour. Make sure to skip already-forecasted questions!

# Add concurrency group to prevent parallel runs
# One shared group: the tournament run and the test run both update the spend
# ledger, so they must not run at the same time.
concurrency:
  group: forecast-bot
  cancel-in-progress: false

# Needed to commit the spend ledger back to the repository.
permissions:
  contents: write


# Daily job to run the simple forecast bot
jobs:
  forecast_job:
    runs-on: ubuntu-latest # determines the machine that will run the job - keep as is
    timeout-minutes: 150 # unfinished questions are picked up by the next run
    steps: # sets up the steps that will be run in order
      # setup repository with all necessary dependencies - keep as is
      - name: Check out repository
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
      - name: Install dependencies
        run: uv sync --locked
      - name: Run bot
        run: |
          uv run python ensemble_bot.py --mode tournament
        # this reads the environment variables from the github repository.
        # Store under Settings --> Secrets and variables --> Actions
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }} # replace this with the name of the variable under which you stored your own Metaculus token
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ASKNEWS_CLIENT_ID: ${{ secrets.ASKNEWS_CLIENT_ID }}
          ASKNEWS_SECRET: ${{ secrets.ASKNEWS_SECRET }}
          # Optional settings. Set them under Settings --> Secrets and variables
          # --> Actions --> Variables. Unset variables fall back to the defaults
          # in ensemble_bot.py.
          BOT_ANTHROPIC_MONTHLY_BUDGET: ${{ vars.BOT_ANTHROPIC_MONTHLY_BUDGET }}
          BOT_OPENAI_MONTHLY_BUDGET: ${{ vars.BOT_OPENAI_MONTHLY_BUDGET }}
          # Deep research and shadow forecasts are on by default. Set a variable to 0 to turn one off.
          BOT_DEEP_RESEARCH: ${{ vars.BOT_DEEP_RESEARCH }}
          BOT_SHADOW_FORECASTS: ${{ vars.BOT_SHADOW_FORECASTS }}
          BOT_ANTHROPIC_RESET_DAY: ${{ vars.BOT_ANTHROPIC_RESET_DAY || '23' }} # day of month the credit resets
          BOT_OPENAI_RESET_DAY: ${{ vars.BOT_OPENAI_RESET_DAY || '5' }} # day of month the credit resets
          BOT_ANTHROPIC_STRONG: ${{ vars.BOT_ANTHROPIC_STRONG }}
          BOT_ANTHROPIC_MID: ${{ vars.BOT_ANTHROPIC_MID }}
          BOT_OPENAI_STRONG: ${{ vars.BOT_OPENAI_STRONG }}
          BOT_OPENAI_MID: ${{ vars.BOT_OPENAI_MID }}
      - name: Save spend ledger and forecast log
        if: always()
        run: |
          if [ -f state/spend_ledger.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state/spend_ledger.json
            # One line per forecast question, with the submitted and the shadow
            # forecasts of each model. Used to score them after resolution.
            if [ -f state/forecast_log.jsonl ]; then
              git add state/forecast_log.jsonl
            fi
            if ! git diff --cached --quiet; then
              git commit -m "Update spend ledger"
              git pull --rebase
              git push
            fi
          fi
